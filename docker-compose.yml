version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: report-app:latest
        container_name: report-app
        volumes:
            - .:/var/www/html
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3306
            - DB_DATABASE=report
            - DB_USERNAME=report
            - DB_PASSWORD=123456
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_CLIENT=phpredis
        depends_on:
            - db
            - redis
        networks:
            - report-net

    nginx:
        image: nginx:1.26.3
        container_name: report-nginx
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - report-net

    db:
        image: mysql:8.0
        container_name: report-mysql
        environment:
            MYSQL_DATABASE: report
            MYSQL_USER: report
            MYSQL_PASSWORD: 123456
            MYSQL_ROOT_PASSWORD: root123
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - report-net

    redis:
        image: redis:8.4-alpine
        container_name: report-redis
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        networks:
            - report-net

networks:
    report-net:
        driver: bridge

volumes:
    mysql-data:
    redis-data:
