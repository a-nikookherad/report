services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: report-app:latest
        container_name: report-app
        volumes:
            - .:/var/www/html
        environment:
            APP_ENV: ${APP_ENV:-local}
            APP_DEBUG: ${APP_DEBUG:-true}

            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}

            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_CLIENT: phpredis
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - report-net

    nginx:
        image: nginx:1.26.3
        container_name: report-nginx
        ports:
            - "${NGINX_PORT:-8000}:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - report-net

    db:
        image: mysql:8.0
        container_name: report-mysql
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        ports:
            - "${MYSQL_PORT:-3306}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - -h
                - 127.0.0.1
                - -u
                - root
                - -p${DB_ROOT_PASSWORD}
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - report-net

    redis:
        image: redis:8.4-alpine
        container_name: report-redis
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        networks:
            - report-net

    phpmyadmin:
        image: phpmyadmin/phpmyadmin:5.0.1
        container_name: report-phpmyadmin
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_ARBITRARY: 0
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT:-64M}
        ports:
            - "127.0.0.1:${PMA_PORT:-8080}:80"
        depends_on:
            db:
                condition: service_healthy
        networks:
            - report-net

networks:
    report-net:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
